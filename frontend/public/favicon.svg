  <rect x="40" y="14" width="6" height="12" fill="#ffffff"/>
  <polygon points="32,10 56,32 8,32" fill="#ffffff"/>
  <rect x="16" y="30" width="32" height="24" fill="#ffffff"/>
  <rect x="28" y="38" width="8" height="16" fill="#f59e0b"/>
</svg>
