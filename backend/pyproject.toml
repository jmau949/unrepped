[project]
name = "hb"
version = "0.1.0"
description = "Buyer-side home-buying intelligence platform: CMA, overbid model, offer back-solver, listing radar"
license = {text = "MIT"}
authors = [{name = "jmau949"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "shapely>=2.0",
    "pandas>=2.2",
    "duckdb>=1.0",
    "homeharvest>=0.8.18,<0.9",
    "usaddress-scourgify>=0.6",
    "rapidfuzz>=3.9",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "win11toast>=0.34; sys_platform == 'win32'",
    "curl-cffi>=0.7",
]

[project.scripts]
hb = "hb.cli:app"

[project.urls]
Repository = "https://github.com/jmau949/unrepped"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hb"]

[tool.pytest.ini_options]
testpaths = ["hb/tests"]

[tool.ruff]
line-length = 100
