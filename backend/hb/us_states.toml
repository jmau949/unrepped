# Reference data for `hb setup` (hb/setup_geo.py): each state's two-digit FIPS
# code and the IANA time zones its counties use, most populous first. A state
# with one zone needs no question; for the rest the wizard asks, defaulting to
# the first. Not a geography: nothing here is read once geography.toml exists.

[zones]                          # how the wizard names a zone when it asks
"America/New_York" = "Eastern"
"America/Detroit" = "Eastern"
"America/Indiana/Indianapolis" = "Eastern"
"America/Chicago" = "Central"
"America/Menominee" = "Central"
"America/Denver" = "Mountain"
"America/Boise" = "Mountain"
"America/Phoenix" = "Mountain, no daylight saving"
"America/Los_Angeles" = "Pacific"
"America/Anchorage" = "Alaska"
"America/Adak" = "Hawaii-Aleutian"
"Pacific/Honolulu" = "Hawaii"

[states]
AL = { name = "Alabama", fips = "01", zones = ["America/Chicago"] }
AK = { name = "Alaska", fips = "02", zones = ["America/Anchorage", "America/Adak"] }
AZ = { name = "Arizona", fips = "04", zones = ["America/Phoenix"] }
